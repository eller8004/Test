<!DOCTYPE html>
<html>
    <head>
            <title>The Seven Wonders of the Ancient World</title>

            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.3/dist/leaflet.css"
            integrity="sha512-Rksm5RenBEKSKFjgI3a41vrjkw4EVPlJ3+OiI65vTjIdo9brlAacEuKOiQ5OFh7cOI1bkDwLqdLw3Zg0cRJAAQ=="
            crossorigin=""/>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

            <!-- Make sure you put this AFTER Leaflet's CSS -->
            <script src="https://unpkg.com/leaflet@1.3.3/dist/leaflet.js"
            integrity="sha512-tAGcCfR4Sc5ZP5ZoVz0quoZDYX5aCtEm/eu1KhSLj2c9eFrylXZknQYmxUssFaVJKvvc0dJQixhGjG2yXWiV9Q=="
            crossorigin="">
            </script>
            <!--The following style tag contains CSS for altering the appearance of the textbox on narrow screens-->
            <!--The 500px value on line 33 determines at what width the textbox will cover the entire width of the map-->
             <style>
                

                #textbox{
                    position: absolute;
                    border-radius: 2px;
                    font-family: sans-serif;
                    color: rgb(149, 195, 199);
                    top: 20px;
                    left: 20px;
                    max-width: 200px;
                    z-index: 1003;
                    background: #890f2b;
                    box-shadow: 0px 0px 2px 2px rgba(0, 0, 0, 0.2);  
                    }

                    #boximg{
                  display: block;
                  margin-left: auto;
                  margin-right: auto;
                  margin-bottom: 12px;
                  margin-top: 8px;
                  width: 90%;
                  }
                  #txtcontainer{
                    width: 90%;
                  }
                  #markerlink{
                    margin-left: 10px;

                  }
                

                @media (max-width: 500px) {
                    #textbox{
                        top: 0px;
                        left: 8px;
                        display: inline-block;
                        max-width: calc(100% - 16px);
                        width: calc(100% - 16px);
                        box-shadow: 0px 2px 2px 0px rgba(0, 0, 0, 0.2);
                    }

                    #boximg{
                      display: inline;
                      float:right;
                      margin-left: auto;
                      margin-right: auto;
                      padding-right: 12px;
                      margin-bottom: 12px;
                      margin-top: 8px;
                      width: 38%;
                    }
                    #txtcontainer{
                      float:left;
                      overflow:auto;
                      width: 58%;
                    }
                }

                a{
                    
                    
                }

                h1, h2, h3 {
                    font-family: 'Helvetica', cursive;
                    letter-spacing: 1px;
                }

                #mapTitle{
                    padding: 6px 10px 6px 10px;
                    margin: 0px;
                }
                #mapDescription{
                    padding: 0px 10px 6px 10px;
                    margin: 0px;
                             }           
                </style>
          

    </head>
    <body>
        <div id='textbox'>
          <div id="txtcontainer">
            <h3 id="mapTitle">The Seven Wonders of the Ancient World </h3>
            <p id="mapDescription"><img id="boximg"  src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
            alt="Smiley face" height="1" width="1">This map shows the locations of the Seven Wonders of the Ancient World.</p>
          </div>
            <img id="boximg"  src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" height="1" width="1">
            <div id="legende">
            </div>
          </div>
        <div id="mapid" style="width: 100%; height: 400px;"></div>
        <script type="text/javascript">

            //GEOJSON START

          let myGeoJson = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/pyramides-edited.jpeg",
        "title": "The pyramids of Giza",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          31.1343,
          29.9792
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/zeus-edited.jpg",
        "title": "The Statue of Zeus at Olympia",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          21.630000,
          37.637861
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/artemis-edited.jpg",
        "title": "The Temple of Artemis at Ephesus",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          27.364,
          37.949
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/Mausoleum-Halicarnassus.webp",
        "title": "Mausoleum at Halicarnassus",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          27.4241,
          37.0379
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/gardenshangign-edited.jpg",
        "title": "The Hanging Gardens of Babylon ",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
           44.4212,
          32.5424
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/rhodes-edited.jpg",
        "title": "The colossus of Rhodes",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          28.2265,
           36.4511
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "imgUrl": "https://eller8004.azurewebsites.net/wp-content/uploads/2026/10/lighthouse-edited.png",
        "title": "The Lighthouse of Alexandria",
        "descr": "",
        "shortDescr": "Click for more information"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          29.8860,
          31.2148
        ]
      }
    }
  ]
}

            //GEOJSON END

            let map = L.map('mapid').setView([47.0707, 15.4395], 11);

            //You can swap map tiles by commenting in/out the code below. 
            //You can also copy various tile codes from the following url. Some providers require you register to get a token:
            //https://leaflet-extras.github.io/leaflet-providers/preview/
            //When copying into this leaflet map start with 'L.Tilelayer....'
            //Add '.addTo(map)' before the semicolon as seen in the functioning codes below
            /*
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            */
            /*
            L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
              maxZoom: 20,
              attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors'
            }).addTo(map);*/

            var OpenStreetMap_HOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles style by <a href="https://www.hotosm.org/" target="_blank">Humanitarian OpenStreetMap Team</a> hosted by <a href="https://openstreetmap.fr/" target="_blank">OpenStreetMap France</a>'
            }).addTo(map);


            map.zoomControl.setPosition('bottomleft');
                     
            function markerClicked(evt) {
                
               //console.log(evt.target);
                document.getElementById("mapTitle").innerText = evt.target.feature.properties.title;
                document.getElementById("mapDescription").innerText = evt.target.feature.properties.descr;
                var imgcontainer;
                var loadimage = false;
                if (evt.target.feature.properties.linkUrl){
                    if (document.getElementById("markerlink") == null){
                        let myLink = document.createElement('A');
                        myLink.setAttribute("id", "markerlink");
                        //myLink.setAttribute("margin-left", "12px");
                        let linkText = document.createTextNode(evt.target.feature.properties.linkTitle);
                        myLink.appendChild(linkText);
                        //myLink.setAttribute("href", evt.target.feature.properties.linkUrl);
                        myLink.href = evt.target.feature.properties.linkUrl;
                        
                        myLink.setAttribute('target', '_blank'); // if it doesn't, set attributes
                        
                        document.getElementById("txtcontainer").appendChild(myLink);
                    } else {
                      let myLink = document.getElementById("markerlink");
                      let linkText = document.createTextNode(evt.target.feature.properties.linkTitle);
                      myLink.innerText = "";
                      myLink.appendChild(linkText);
                      myLink.href = evt.target.feature.properties.linkUrl;
                    }
                }else{
                  if (document.getElementById("markerlink") != null){
                    document.getElementById("txtcontainer").removeChild(document.getElementById("markerlink"));
                  }
                }
                    
                    
                console.log(evt.target.feature.properties.imgUrl);
                if (evt.target.feature.properties.imgUrl){
                    document.getElementById("boximg").setAttribute("src", (evt.target.feature.properties.imgUrl));
                    document.getElementById("boximg").setAttribute("width", "90%");
                    document.getElementById("boximg").setAttribute("height", "auto");
                    document.getElementById("txtcontainer").setAttribute("width", "58%");
                } else {
                    document.getElementById("boximg").setAttribute("src", ("data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="));
                    document.getElementById("boximg").setAttribute("width", "1px");
                    document.getElementById("boximg").setAttribute("height", "1px");
                    document.getElementById("txtcontainer").setAttribute("width", "90%");  
                }
            }

            //This is a function for activating your geojson data in the map
            let customMarkerIcon = L.divIcon({
                className: 'custom-marker',
                html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#890f2b"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [0, -34],
                tooltipAnchor: [16, -28]
            });
            let schlossbergIcon = L.divIcon({
              className: 'custom-marker',
              html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#b92548"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
              iconSize: [25, 41],
              iconAnchor: [12, 41],
              popupAnchor: [0, -34],
              tooltipAnchor: [16, -28]
            });
            let universityIcon = L.divIcon({
              className: 'custom-marker',
              html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#a2d2ff"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
              iconSize: [25, 41],
              iconAnchor: [12, 41],
              popupAnchor: [0, -34],
              tooltipAnchor: [16, -28]
            });
            let eggenbergIcon = L.divIcon({
                className: 'custom-marker',
                html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#5f0f40"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [0, -34],
                tooltipAnchor: [16, -28]
            });
            let murinselIcon = L.divIcon({
              className: 'custom-marker',
              html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#335c67"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
              iconSize: [25, 41],
              iconAnchor: [12, 41],
              popupAnchor: [0, -34],
              tooltipAnchor: [16, -28]
            });
            let hauptplatzIcon = L.divIcon({
                className: 'custom-marker',
                html: '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0zm0 17.7a5.2 5.2 0 1 1 0-10.4 5.2 5.2 0 0 1 0 10.4z" fill="#f7b1b0"/><circle cx="12.5" cy="12.5" r="4.3" fill="white"/></svg>',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [0, -34],
                tooltipAnchor: [16, -28]
            });

            let layerGroup = L.geoJSON([], {
                pointToLayer: function (feature, latlng) {
              let icon = feature.properties.title === 'Schlossberg' ? schlossbergIcon : customMarkerIcon;
              if (feature.properties.title === 'University of Graz') {
                icon = universityIcon;
              }
              if (feature.properties.title === 'Castle Eggenberg') {
                icon = eggenbergIcon;
              }
              if (feature.properties.title === 'Murinsel') {
                icon = murinselIcon;
              }
              if (feature.properties.title === 'Hauptplatz Graz') {
                icon = hauptplatzIcon;
              }
                return L.marker(latlng, { icon: icon });
                },
                onEachFeature: function (feature, layer) {
                    var props = feature.properties;
                    layer.bindTooltip(props.shortDescr);
                    layer.on({
                    click: markerClicked
                    });

                    layer.title = props.title;

                    layer.descr = props.descr;
                   
                }
            }).addTo(map);
            
            layerGroup.addData(myGeoJson);
            map.fitBounds(layerGroup.getBounds(), { padding: [40, 40] });
           
            //The following function is for development only, it logs lat, lng and zoomlevel to the console
            //for simpler setting of center and zoom level. It is commented out by default.
            //This function runs on the event zoomend, meaning when the map is done zooming the function is called.
            function onMapClick(e) {
                console.log(e.latlng.toString()+"  zoom level : "+map.getZoom());
                    
            }
            map.on('click', onMapClick);    

            
        </script>
    </body>
</html>
